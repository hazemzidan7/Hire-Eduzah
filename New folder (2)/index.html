<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eduzah — Hiring Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="header-brand">
      <img src="img/eduzah-logo.svg" alt="Eduzah" class="logo-img" width="168" height="40" decoding="async" id="siteLogo" />
    </div>
    <p class="subtitle" id="headerSubtitle">انضم لفريقنا — قدّم على وظيفة</p>
  </header>
  <div class="progress-bar" id="progressBar" role="progressbar" aria-label="Progress"></div>
  <div class="card" id="formCard">
    <div id="stepContent"></div>
  </div>
</div>

<div class="submit-overlay" id="submitOverlay" aria-hidden="true" role="status">
  <div class="submit-overlay-card">
    <div class="submit-spinner" aria-hidden="true"></div>
    <p class="submit-overlay-msg" id="submitOverlayMsg">جاري الإرسال...</p>
  </div>
</div>
<script>
(function () {
  var logo = document.getElementById('siteLogo');
  if (!logo) return;
  var fallbacks = ['img/logo.png', 'img/logo_1.PNG', 'logo.png'];
  var i = 0;
  logo.addEventListener('error', function () {
    if (i < fallbacks.length) {
      logo.src = fallbacks[i++];
      return;
    }
    logo.replaceWith((function () {
      var s = document.createElement('span');
      s.className = 'logo-wordmark';
      s.setAttribute('aria-label', 'Eduzah');
      s.innerHTML = '<em>e</em>duzah';
      return s;
    })());
  });
})();
</script>
<script src="js/config.example.js"></script>
<script src="js/config.js"></script>
<script src="national-id-parser.js"></script>
<script src="js/form-schema.js"></script>
<script src="js/form-store.js"></script>
<script src="js/form-collector.js"></script>
<script src="js/validation.js"></script>
<script src="js/error-handler.js"></script>
<script src="js/ui-state.js"></script>
<script src="js/queue-service.js"></script>
<script src="js/cloudinary.js"></script>
<script src="js/sheets-api.js"></script>
<script src="js/submission-service.js"></script>
<script src="form.js"></script>
</body>
</html>
